[project]
name = "bluelock-backend"
version = "1.0.0"
description = "BlueLock Smart Stadium command grid API"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["B008"]  # FastAPI Depends in defaults

[tool.ruff.lint.isort]
known-first-party = ["config", "controllers", "models", "routes", "services"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["\\.venv"]

[[tool.mypy.overrides]]
module = ["google.*", "google.genai.*"]
ignore_missing_imports = true
